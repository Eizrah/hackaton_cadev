<!DOCTYPE html>
<html>
<head>
    <title>Test Image</title>
</head>
<body>
    <h1>Test chargement d'image</h1>
    
    <h2>Image directe depuis Django</h2>
    <img src="http://localhost:8000/media/profil_pictures/profil_KaeBtE3.jpg" alt="Test Django" style="width: 100px; height: 100px; border: 2px solid green;">
    
    <h2>État du chargement</h2>
    <div id="status"></div>
    
    <script>
        const img = document.querySelector('img');
        const status = document.getElementById('status');
        
        img.onload = () => {
            status.innerHTML = '<p style="color: green;">✅ Image chargée avec succès !</p>';
        };
        
        img.onerror = () => {
            status.innerHTML = '<p style="color: red;">❌ Erreur : Image non chargée</p><p>URL tentée : ' + img.src + '</p>';
        };
    </script>
</body>
</html>
